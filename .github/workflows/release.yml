name: Release

on:
  release:
    types: [published]

jobs:
  build-and-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare release assets
        run: |
          mkdir -p release-artifacts
          cp dist/aero-slider.min.js dist/aero-slider.min.css aeroslider.md release-artifacts/
          cp dist/aero-slider.core.min.js dist/aero-slider.core.min.css release-artifacts/
          mkdir -p release-artifacts/extensions
          cp dist/extensions/*.min.js dist/extensions/*.min.css release-artifacts/extensions/

      - name: Create zip
        run: |
          cd release-artifacts
          zip -r ../aero-slider-${{ github.event.release.tag_name }}.zip .
          cd ..

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aero-slider-${{ github.event.release.tag_name }}.zip
            aeroslider.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing signs in with this, so there is no token secret
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Check size budget
        run: bun run size

      - name: Check package
        run: bun run check:package

      # prepack builds dist. A prerelease goes to the beta tag so it never becomes the default install.
      - name: Publish to npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
